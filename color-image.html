<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AI Image & Color Change</title>

    <style>
        body {
            background: #f1f1f1;
            font-family: Arial;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: 0.5s;
        }

        .box img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 4px solid white;
        }

        h1 {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="box">
        <img id="photo" src="">
        <h1 id="title">Image Name</h1>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>

        $(function () {

            var items = [

                {
                    bgColor: "red",
                    fontColor: "white",
                    name: "Nature",
                    image: "https://picsum.photos/id/1015/300/200"
                },

                {
                    bgColor: "green",
                    fontColor: "white",
                    name: "Mountain",
                    image: "https://picsum.photos/id/1016/300/200"
                },

                {
                    bgColor: "blue",
                    fontColor: "white",
                    name: "Forest",
                    image: "https://picsum.photos/id/1025/300/200"
                },

                {
                    bgColor: "purple",
                    fontColor: "white",
                    name: "River",
                    image: "https://picsum.photos/id/1035/300/200"
                },

                {
                    bgColor: "orange",
                    fontColor: "white",
                    name: "Road",
                    image: "https://picsum.photos/id/1043/300/200"
                }                                                         

            ];

            let i = 0;

            setInterval(function () {

                $(".box").css({
                    backgroundColor: items[i].bgColor,
                    color: items[i].fontColor
                });

                $("#photo").attr("src", items[i].image);

                $("#title").html(items[i].name);

                i++;

                if (i > items.length - 1) {
                    i = 0;
                }

            }, 2000);

        });

    </script>

</body>

</html>
